name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir -p ../site
          cat site.tgz.b64* | base64 -d | tar -xzf - -C ../site
          touch ../site/.nojekyll
          printf '%s\n' "Smile Slice by Smiles 2322" > ../site/pages.txt
          ls -laR ../site
      - name: Push to gh-pages
        run: |
          cd ../site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Smile Slice"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Enable GitHub Pages
        run: |
          code=$(curl -sS -o /tmp/pages-out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "Pages API status: $code"
          cat /tmp/pages-out
          case "$code" in
            201|409) exit 0 ;;
            *) exit 1 ;;
          esac
