name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir -p ../site
          cat site.tgz.b64* | base64 -d | tar -xzf - -C ../site
          touch ../site/.nojekyll
          printf '%s\n' "Smile Slice by Smiles 2322" > ../site/pages.txt
          ls -laR ../site
      - name: Push to gh-pages
        run: |
          cd ../site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Smile Slice"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
